<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.gstatic.com; worker-src 'self' blob: https://www.gstatic.com; connect-src 'self' http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:* https://*.supabase.co wss://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com https://www.gstatic.com blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; manifest-src 'self'"
  >
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta
    name="description"
    content="Another retro runner game: runner retro con campaña, jefes, progresión por personaje y Boss Rush."
  >

  <!-- Mobile Fullscreen & PWA Meta Tags (Android & iOS Safari) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Another retro runner game">
  <meta name="theme-color" content="#070D16">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Another retro runner game</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070D16;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Retro Arcade Web Loading Screen */
    #app-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0F1D32 0%, #070D16 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      color: #FFFFFF;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    .retro-card {
      border: 3px solid #00F5FF;
      box-shadow: 0 0 25px rgba(0, 245, 255, 0.45), inset 0 0 15px rgba(0, 245, 255, 0.2);
      border-radius: 8px;
      padding: 24px 32px;
      background: rgba(10, 18, 30, 0.95);
      text-align: center;
      max-width: 90vw;
      box-sizing: border-box;
    }

    .retro-title {
      font-size: 18px;
      font-weight: 900;
      color: #FFD700;
      letter-spacing: 2.5px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
      margin-bottom: 10px;
    }

    .retro-sub {
      font-size: 12px;
      color: #00F5FF;
      letter-spacing: 1.5px;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .progress-bar-container {
      width: 240px;
      max-width: 65vw;
      height: 12px;
      border: 2px solid #00F5FF;
      border-radius: 6px;
      padding: 2px;
      margin: 0 auto;
      background: #050B12;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #FF0055, #FF8800, #FFEE00, #00FF66, #00F5FF, #7928CA, #FF0055);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: rainbowGlow 1.8s linear infinite;
    }

    @keyframes rainbowGlow {
      0% { background-position: 100% 0%; }
      100% { background-position: 0% 0%; }
    }

    .retro-hint {
      font-size: 11px;
      color: #8CA0BA;
      margin-top: 14px;
      letter-spacing: 1px;
    }

    #portrait-orientation-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0F1D32 0%, #070D16 100%);
      z-index: 9999999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      color: #FFFFFF;
    }

    @media screen and (orientation: portrait) and (max-width: 950px) {
      #portrait-orientation-warning {
        display: flex;
      }
    }

    .rotate-card {
      border: 3px solid #00F5FF;
      box-shadow: 0 0 30px rgba(0, 245, 255, 0.5), inset 0 0 15px rgba(0, 245, 255, 0.2);
      border-radius: 8px;
      padding: 28px 24px;
      background: rgba(10, 18, 30, 0.96);
      max-width: 85vw;
      box-sizing: border-box;
    }

    .rotate-icon {
      font-size: 46px;
      margin-bottom: 12px;
      animation: rotatePhone 2.2s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes rotatePhone {
      0%, 15% { transform: rotate(0deg); }
      50%, 65% { transform: rotate(-90deg); }
      90%, 100% { transform: rotate(0deg); }
    }

    .rotate-title {
      font-size: 15px;
      font-weight: 900;
      color: #FFD700;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
      margin-bottom: 10px;
    }

    .rotate-desc {
      font-size: 12px;
      color: #00F5FF;
      line-height: 1.4;
      font-weight: bold;
    }
  </style>

  <script>
    function tryLockLandscape() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function() {});
      }
    }
    window.addEventListener('load', tryLockLandscape);
    window.addEventListener('orientationchange', tryLockLandscape);
    // PWA Install Prompt Capture
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('janosos-installable'));
    });

    window.janososPromptInstall = function() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        return deferredInstallPrompt.userChoice.then(function(choice) {
          deferredInstallPrompt = null;
          return choice.outcome === 'accepted';
        });
      }
      return Promise.resolve(false);
    };

    window.janososEnterFullscreen = function() {
      const docEl = document.documentElement;
      const requestFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      if (requestFs) {
        return requestFs.call(docEl).then(function() {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(function() {});
          }
          return true;
        }).catch(function() { return false; });
      }
      return Promise.resolve(false);
    };

    window.janososIsStandalone = function() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.matchMedia('(display-mode: fullscreen)').matches ||
             navigator.standalone === true;
    };

    // Auto-enter fullscreen on mobile upon interaction if desired
    function enterFullscreenOnMobile() {
      if (!window.janososIsStandalone()) {
        window.janososEnterFullscreen();
      }
    }
    window.addEventListener('touchstart', enterFullscreenOnMobile, { once: true, passive: true });
    window.addEventListener('click', enterFullscreenOnMobile, { once: true, passive: true });

    // Hide arcade loading screen once Flutter renders
    function hideLoadingScreen() {
      const loader = document.getElementById('app-loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      }
    }
    window.addEventListener('flutter-first-frame', hideLoadingScreen);
    setTimeout(hideLoadingScreen, 12000);
  </script>
</head>
<body>
  <!-- Orientation warning overlay for mobile browsers held vertically -->
  <div id="portrait-orientation-warning">
    <div class="rotate-card">
      <div class="rotate-icon">📱</div>
      <div class="rotate-title">GIRA TU DISPOSITIVO</div>
      <div class="rotate-subtitle">ORIENTACIÓN HORIZONTAL REQUERIDA</div>
      <div class="rotate-desc">Another retro runner game requiere jugarse con la pantalla en horizontal (Landscape).</div>
    </div>
  </div>

  <!-- Retro Loading Screen shown before Flutter engine initializes -->
  <div id="app-loading-screen">
    <div class="retro-card">
      <div class="retro-title">★ ANOTHER RETRO RUNNER GAME ★</div>
      <div class="retro-sub">CARGANDO SISTEMA DE JUEGO...</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="retro-hint">OPTIMIZANDO RECURSOS Y SPRITES</div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
