name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - name: Build production web bundle
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          AUTH_REDIRECT_URI: ${{ vars.AUTH_REDIRECT_URI }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_APPLE_CLIENT_ID: ${{ vars.GOOGLE_APPLE_CLIENT_ID }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Configuración Supabase detectada. Compilando con backend Supabase..."
            flutter build web --release --base-href "/Janosos_Game/" \
              --no-web-resources-cdn \
              --dart-define=APP_BACKEND=supabase \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
              --dart-define=AUTH_REDIRECT_URI="${AUTH_REDIRECT_URI:-https://Janosos.github.io/Janosos_Game/}" \
              --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
              --dart-define=GOOGLE_APPLE_CLIENT_ID="$GOOGLE_APPLE_CLIENT_ID" \
              --dart-define=CONTENT_VERSION=v6-preview-1
          else
            echo "Sin credenciales Supabase en variables. Compilando en modo local/offline..."
            flutter build web --release --base-href "/Janosos_Game/" \
              --no-web-resources-cdn \
              --dart-define=APP_BACKEND=local \
              --dart-define=CONTENT_VERSION=v6-preview-1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
